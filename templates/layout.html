<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{title|safe}}</title>
  <meta name="referrer" content="origin-when-cross-origin" />
  <link rel="shortcut icon" href="{{url_for('static', filename=icon+'favicon.ico')}}" />
  <link rel="apple-touch-icon" href="{{url_for('static', filename=icon+'apple-touch-icon.png')}}" />
  <link rel="apple-touch-icon-precomposed" href="{{url_for('static', filename=icon+'apple-touch-icon-precomposed.png')}}" />
  <meta name="theme-color" content="{{view.theme_color|safe}}" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no" />
  <link rel="stylesheet" href="https://bootswatch.com/4/{{view.theme|safe}}/bootstrap.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <style>
    .selectee:hover {background-color: rgba(128,128,128,0.25);}
    .selected-msgA {border-width: 3px !important;}
    abbr[title].abbr-plain {text-decoration: none; cursor: inherit;}
    th {cursor: default;}
    #loadOverlay {background-color: {{view.theme_color|safe}}; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000;}
    #mainOverlay {display: none;}
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.1/umd/popper.min.js"></script>
  <script src="{{url_for('static', filename='bootstrap.min.js')}}"></script>
  <script src="{{url_for('static', filename='common.js')}}"></script>
  {% block libs %}{% endblock %}
  {% block scripts %}{% endblock %}
</head>
<body data-mode="{{view.mode}}">
  <div id="loadOverlay"></div>
  <div id="mainOverlay">
  {% include 'nav.html' %}
  {% block main %}{% endblock %}
  </div>
</body>
</html>
